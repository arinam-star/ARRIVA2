    <!-- СКРИПТ ДЛЯ МУЗЫКИ -->
    <script>
        let currentAudio = null;

        function playAudio(audioId, button) {
            const audio = document.getElementById(audioId);

            // Если нажали на ту же песню, которая играет — ставим на паузу
            if (currentAudio === audio) {
                if (audio.paused) {
                    audio.play();
                    button.textContent = "⏸ Пауза";
                } else {
                    audio.pause();
                    button.textContent = "▶ Песня по вайбу";
                }
                return;
            }

            // Если играет другая песня — выключаем её
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0; // сброс на начало
                // Возвращаем текст кнопки у предыдущей песни
                document.querySelectorAll('.play-btn').forEach(btn => btn.textContent = "▶ Песня по вайбу");
            }

            // Включаем новую
            audio.play();
            button.textContent = "⏸ Пауза";
            currentAudio = audio;

            // Когда песня заканчивается, возвращаем кнопку в исходное состояние
            audio.onended = function() {
                button.textContent = "▶ Песня по вайбу";
                currentAudio = null;
            };
        }
    </script>
